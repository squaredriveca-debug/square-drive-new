                    if (itemDateStr === actualTodayStr) todayRev += amt;
                    if (itemDateStr >= revStartDateStr && itemDateStr <= revEndDateStr) {
                        selectedDateRev += amt;
                        selectedDateBreakdown.push({ ...b, parsedDate: itemDateStr, key });
                    }
                    if (itemDateStr.startsWith(revMonth)) monthRev += amt;
                    if (itemDateStr.startsWith(revYear)) annualRev += amt;
                });

                selectedDateBreakdown.sort((a,b) => a.parsedDate.localeCompare(b.parsedDate));

            // Manifest

            const userBalObj = useMemo(() => {

            const hasEnoughWeekdayCredits = userBalObj.weekday >= selections.length;

            const canUseWeekday = hasEnoughWeekdayCredits && isWeekdayAllowed && !isRainySelected;
            const hasEnoughWeekendCredits = userBalObj.weekend >= selections.length;
            const canUseWeekend = hasEnoughWeekendCredits && !isRainySelected;

            const userHistory = useMemo(() => {
                if (!currentUser) return [];
                const phone = getCleanPhone(currentUser.phone || '');
                
                return Object.entries(bookings)
                    .filter(([key, b]) => b.phone === phone || b.email === currentUser.email)
                    .map(([key, b]) => ({ ...b, key }))
                    .sort((a, b) => {
                        // Precise Chronological Date + Time parsing
                        const parseDateTime = (dateStr, timeStr) => {
                            if (!dateStr || !timeStr) return 0;
                            const [day, month, year] = dateStr.split(/[-/]/);
                            if (!day || !month || !year) return 0;
                            
                            const [time, modifier] = timeStr.split(' ');
                            if (!time || !modifier) return 0;
                            let [hours, minutes] = time.split(':');
                            if (!hours || !minutes) return 0;
                            
                            hours = parseInt(hours, 10);
                            if (hours === 12 && modifier.toUpperCase() === 'AM') hours = 0;
                            else if (modifier.toUpperCase() === 'PM' && hours < 12) hours += 12;
                            
                            return new Date(year, month - 1, day, hours, parseInt(minutes, 10)).getTime();
                        };

                        const timeA = parseDateTime(a.bookingDate || a.date, a.bookingTime || a.time);
                        const timeB = parseDateTime(b.bookingDate || b.date, b.bookingTime || b.time);
                        
                        return timeB - timeA; // Descending (Newest to Oldest)
                    });
            }, [bookings, currentUser]);

            // Contacts
            const cleanManualPhone = getCleanPhone(manualPhone);
            const matchedManualUser = useMemo(() => {

                if (allContacts[cleanManualPhone]) return allContacts[cleanManualPhone];
                return Object.values(allContacts).find(c => c.phone && (c.phone.endsWith(cleanManualPhone) || cleanManualPhone.endsWith(c.phone)));
            }, [allContacts, cleanManualPhone]);

            const manualUserBal = useMemo(() => {

                const pKey = getCleanPhone(matchedManualUser.phone);

            }, [matchedManualUser, userCredits]);

            const isManualWeekend = manualEntryModal ? (new Date(manualEntryModal.date).getDay() === 0 || new Date(manualEntryModal.date).getDay() === 6) : false;

            const isManualRainy = manualEntryModal ? isDateInRainySeason(manualEntryModal.date) : false;
            const canUseManualCredits = manualRelevantCredits > 0 && !isManualRainy;

            const filteredContacts = useMemo(() => {

            useEffect(() => {

            const applyFacilityControl = (action) => {

                const nextBookings = { ...bookings };
                const nextCredits = { ...userCredits };

                const isVerifying = b.paymentStatus !== 'verified';

                b.verifiedBy = isVerifying ? currentUser?.name || 'System Admin' : null;
                b.verifiedByRole = isVerifying ? userRole : null;

                            if (nextCredits[activeKey]) {
                                nextCredits[activeKey][tier] = Math.max(0, (nextCredits[activeKey][tier] || 0) - sessions);
                                nextCredits[activeKey][`${tier}Bought`] = Math.max(0, (nextCredits[activeKey][`${tier}Bought`] || 0) - sessions);

                        }

                            if (nextCredits[activeKey]) {

                                nextCredits[activeKey][`${tier}Bought`] = Math.max(0, (nextCredits[activeKey][`${tier}Bought`] || 0) - sessions);

                            email: currentUser.email,
                            phone: cleanPhone,
                            sessions: selectedPackage.sessions,
                            packageType: tier,
                            date: now.toLocaleDateString('en-IN'),
                            time: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
                            bookingDate: now.toLocaleDateString('en-IN'),
                            bookingTime: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                        };
                    } else {
                        // Slot Booking Logic
                        if (paymentMethod === 'weekday_credits' || paymentMethod === 'weekend_credits') {
                            const uo = { ...nextCredits[currentUser.email] || { weekday: 0, weekend: 0, weekdayBought: 0, weekendBought: 0, weekdayUsed: 0, weekendUsed: 0 } };
                            let rem = selections.length;
                            if (paymentMethod === 'weekend_credits') {
                                const used = Math.min(uo.weekend || 0, rem);
                                uo.weekend = Math.max(0, (uo.weekend || 0) - used);
                                uo.weekendUsed = (uo.weekendUsed || 0) + used;
                            } else {
                                const used = Math.min(uo.weekday || 0, rem);
                                uo.weekday = Math.max(0, (uo.weekday || 0) - used);
                                uo.weekdayUsed = (uo.weekdayUsed || 0) + used;
                            }
                            nextCredits[currentUser.email] = uo;
                        }
                        
                        const isVerified = (paymentMethod === 'weekday_credits' || paymentMethod === 'weekend_credits');

                        selections.forEach(s => { 
                            nextBookings[`${selectedDate}-${s.net}-${s.slot}`] = { 
                                type: 'user', user: currentUser.name, email: currentUser.email, phone: cleanPhone,
                                priceAtBooking: isVerified ? 0 : (slotPrices[s.slot] || 500), 
                                paymentMode: paymentMethod, paymentStatus: isVerified ? 'verified' : 'pending',
                                date: selectedDate, slot: s.slot, net: s.net, status: null,
                                // Avoid huge payload in DB, replace base64 with flag
                                verificationImage: screenshotPreview ? "UPLOADED" : null,
                                bookingDate: now.toLocaleDateString('en-IN'),
                                bookingTime: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                            }; 
                        });
                        triggerToast("Nets reserved successfully!", "success");
                    }
                    
                    setBookings(nextBookings);
                    setUserCredits(nextCredits);
                    await syncToCloud({ bookings: nextBookings, allContacts, systemCodes, userCredits: nextCredits, slotPrices, blockedDays, packagePrices, seasonDates });
                    
                    setTicketData(newTicket); setIsProcessing(false); setIsSuccess(true); setSelections([]); setSelectedPackage(null); setShowPayment(false); setScreenshotPreview(null);
                }, 1500);
            };

            const finalizeManualBooking = async () => {
                const { net, slot, date } = manualEntryModal;
                const key = `${date}-${net}-${slot}`;
                
                if (manualEntryType === 'maintenance' || manualEntryType === 'resting') {
                    const next = { ...bookings, [key]: { 
                        type: 'system', status: manualEntryType,
                        user: manualEntryType === 'resting' ? 'Facility Closed - Resting Hours' : 'Maintenance Lock', 
                        date: date, slot: slot, net: net, 
                        bookingDate: new Date().toLocaleDateString('en-IN'),
                        bookingTime: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                    }};
                    setBookings(next);
                    await syncToCloud({ bookings: next, allContacts, systemCodes, userCredits, slotPrices, blockedDays, packagePrices, seasonDates });
                    triggerToast(manualEntryType === 'resting' ? "Slot locked for resting hours." : "Slot locked for maintenance.", "success");
                    setManualEntryModal(null);
                    return;
                }

                let price = manualPayment === 'credits' ? 0 : (slotPrices[slot] || 500);
                const isVerified = (manualPayment === 'credits');
                
                const nextBookings = { ...bookings, [key]: { 
                    type: 'user', user: manualName, phone: manualPhone, priceAtBooking: price, 
                    paymentMode: manualPayment, paymentStatus: isVerified ? 'verified' : 'pending',
                    verificationImage: manualScreenshot ? "UPLOADED" : null,
                    date: date, slot: slot, net: net, status: null,
                    bookingDate: new Date().toLocaleDateString('en-IN'),
                    bookingTime: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                }};

                let nextCredits = { ...userCredits };
                if (manualPayment === 'credits') {
                    const cleanPhone = getCleanPhone(manualPhone);
                    let match = allContacts[cleanPhone] || Object.values(allContacts).find(c => c.phone && (c.phone.endsWith(cleanPhone) || cleanPhone.endsWith(c.phone)));
                    if (match) {
                        const isWeekend = new Date(date).getDay() === 0 || new Date(date).getDay() === 6;
                        const eKey = match.email;
                        const pKey = getCleanPhone(match.phone);
                        const activeKey = (eKey && nextCredits[eKey]) ? eKey : (pKey && nextCredits[pKey] ? pKey : (eKey || pKey));
                        
                        const uo = { ...nextCredits[activeKey] || { weekday: 0, weekend: 0, weekdayBought: 0, weekendBought: 0, weekdayUsed: 0, weekendUsed: 0 } };
                        if (isWeekend) {
                            if ((uo.weekend || 0) > 0) { uo.weekend -= 1; uo.weekendUsed = (uo.weekendUsed || 0) + 1; }
                        } else {
                            if ((uo.weekday || 0) > 0) { uo.weekday -= 1; uo.weekdayUsed = (uo.weekdayUsed || 0) + 1; }
                            else if ((uo.weekend || 0) > 0) { uo.weekend -= 1; uo.weekendUsed = (uo.weekendUsed || 0) + 1; }
                        }
                        nextCredits[activeKey] = uo;
                    }
                }

                let nextContacts = { ...allContacts };
                const cleanManualPhone = getCleanPhone(manualPhone);
                let checkMatch = nextContacts[cleanManualPhone] || Object.values(nextContacts).find(c => c.phone && (c.phone.endsWith(cleanManualPhone) || cleanManualPhone.endsWith(c.phone)));
                if (!checkMatch) {
                    nextContacts[cleanManualPhone] = { name: manualName, phone: cleanManualPhone, type: 'guest', email: '' };
                }

                setBookings(nextBookings);
                setUserCredits(nextCredits);
                setAllContacts(nextContacts);
                await syncToCloud({ bookings: nextBookings, allContacts: nextContacts, systemCodes, userCredits: nextCredits, slotPrices, blockedDays, packagePrices, seasonDates });

                triggerToast("Manual booking added successfully!", "success");
                setManualEntryModal(null);
            };

            if (!isAppReady) {
                return (
                    <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center text-white">

                                                <span className="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mt-1.5">Partial Closure</span>
                                            </button>
                                        </div>

                                        {controlDuration === 'hours' && (
                                            <div className="grid grid-cols-2 gap-4 animate-in fade-in slide-in-from-top-2 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                                                <div>
                                                    <label className="block text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1.5">From</label>

                                                    </select>
                                                </div>

                                    {/* Reason Selection */}
                                    <div>

                                    syncToCloud({ bookings, allContacts: nextContacts, systemCodes, userCredits, slotPrices, blockedDays, packagePrices, seasonDates });

                                    const nextCodes = {
                                        ...systemCodes,
                                        [newKey]: {
                                            code: val.toLowerCase(),
                                            phone: e.target.sys_phone.value,
                                            email: e.target.sys_email.value,
                                            name: e.target.sys_name.value,

                                        }

                                    triggerToast("New system user added successfully.", "success");
                                } else {
                                    const newPhone = e.target.sys_phone.value;
                                    const newEmail = e.target.sys_email.value;
                                    const newName = e.target.sys_name ? e.target.sys_name.value : editPasswordModal.sysName;
                                    const nextCodes = { ...systemCodes, [editPasswordModal.id]: { ...systemCodes[editPasswordModal.id], code: val.toLowerCase(), phone: newPhone, email: newEmail, name: newName } };

                    {showMyBookings && currentUser && (
                        <div className="fixed inset-0 flex items-center justify-center z-[130] bg-black/80 backdrop-blur-md px-4 animate-in">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col relative border max-h-[85vh] text-left">
                                <div className="p-8 border-b flex justify-between items-center bg-gray-50 shrink-0 text-left">
                                    <div className="text-left"><h3 className="text-2xl font-black text-gray-900 uppercase leading-none mb-1 text-left">{currentUser.name}</h3><span className="px-2 py-0.5 bg-green-100 text-green-700 text-[8px] font-black uppercase rounded tracking-widest text-left">{currentUser.type} Account Profile</span></div>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setCurrentUser(null); setShowMyBookings(false); }} className="p-2.5 bg-red-50 text-red-500 rounded-full hover:bg-red-100 transition-all"><Icon name="log-out" className="w-5 h-5"/></button>
                                        <button onClick={() => setShowMyBookings(false)} className="p-2.5 bg-white border border-gray-200 text-onyx rounded-full transition-all text-left text-left"><Icon name="x" className="w-5 h-5"/></button>
                                    </div>
                                </div>
                                <div className="p-8 overflow-y-auto no-scrollbar bg-white flex-1 text-left text-left">
                                    
                                    <div className="bg-gray-50 rounded-3xl p-6 mb-8 border border-gray-100 shadow-sm space-y-4">
                                        <h4 className="text-[10px] font-black text-gray-400 uppercase tracking-widest text-center border-b pb-2">Session Credits Ledger Audit</h4>
                                        
                                        <div className="grid grid-cols-3 gap-2 text-center pb-2">
                                            <div>
                                                <p className="text-[8px] font-black text-gray-400 uppercase tracking-wider mb-1 leading-none">Total Bought</p>
                                                <h4 className="text-xl sm:text-2xl font-black text-slate-800">
                                                    {(userBalObj.weekdayBought || 0) + (userBalObj.weekendBought || 0)}
                                                </h4>
                                            </div>
                                            <div className="flex items-center justify-center text-gray-300 font-bold leading-none">-</div>
                                            <div>
                                                <p className="text-[8px] font-black text-gray-400 uppercase tracking-wider mb-1 leading-none">Sessions Used</p>
                                                <h4 className="text-xl sm:text-2xl font-black text-red-500">
                                                    {(userBalObj.weekdayUsed || 0) + (userBalObj.weekendUsed || 0)}
                                                </h4>
                                            </div>
                                        </div>
                                        
                                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
                                            <div>
                                                <p className="text-[10px] font-black text-green-600 uppercase tracking-widest leading-none mb-1">Balance Remaining</p>
                                                <p className="text-[8px] text-gray-400 font-bold uppercase tracking-wider">Valid Mon-Sun</p>
                                            </div>
                                            <h4 className="text-3xl font-black text-green-600">
                                                {(userBalObj.weekday || 0) + (userBalObj.weekend || 0)}
                                            </h4>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 text-xs">
                                            <div className="bg-white/60 p-3 rounded-xl border text-center">
                                                <p className="text-[9px] font-black text-gray-400 uppercase tracking-wider mb-2">Weekday Pack</p>
                                                <div className="text-[10px] text-gray-600 space-y-0.5 text-left pl-1">
                                                    <p>Bought: <span className="font-bold text-slate-800">{userBalObj.weekdayBought || 0}</span></p>
                                                    <p>Used: <span className="font-bold text-red-500">{userBalObj.weekdayUsed || 0}</span></p>
                                                    <p className="border-t border-gray-100 pt-1 mt-1 font-black text-green-600 text-center">Balance: {userBalObj.weekday || 0}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white/60 p-3 rounded-xl border text-center">
                                                <p className="text-[9px] font-black text-gray-400 uppercase tracking-wider mb-2">Weekend Pack</p>
                                                <div className="text-[10px] text-gray-600 space-y-0.5 text-left pl-1">
                                                    <p>Bought: <span className="font-bold text-slate-800">{userBalObj.weekendBought || 0}</span></p>
                                                    <p>Used: <span className="font-bold text-red-500">{userBalObj.weekendUsed || 0}</span></p>
                                                    <p className="border-t border-gray-100 pt-1 mt-1 font-black text-purple-600 text-center">Balance: {userBalObj.weekend || 0}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <h4 className="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest text-left">Historical Lane Registry</h4>
                                    <div className="space-y-3">
                                        {userHistory.length === 0 ? (
                                            <p className="text-center py-12 font-bold text-gray-400 text-sm italic">Ledger empty.</p>
                                        ) : (
                                            <div className="space-y-3">
                                                <div className="hidden sm:grid grid-cols-12 gap-2 text-[9px] font-black uppercase text-gray-400 tracking-wider pb-2 border-b">
                                                    <div className="col-span-3">Activity Type</div>
                                                    <div className="col-span-3">Lane & Training Time</div>
                                                    <div className="col-span-4">Booked Date & Time</div>
                                                    <div className="col-span-2 text-right">Payment</div>
                                                </div>
                                                {userHistory.map((item, idx) => {
                                                    const isPackage = item.type === 'package';
                                                    if (isPackage) {
                                                        return (
                                                            <div key={idx} className="p-4 border border-purple-100 bg-purple-50/40 rounded-2xl sm:rounded-none sm:border-0 sm:border-b sm:bg-transparent sm:p-3 sm:px-1 grid grid-cols-1 sm:grid-cols-12 gap-2 items-center text-xs">
                                                                <div className="col-span-3">
                                                                    <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Activity:</span>
                                                                    <span className="px-2 py-0.5 bg-purple-100 text-purple-700 text-[9px] font-black uppercase rounded tracking-wider">Package</span>
                                                                    <span className="font-bold text-gray-900 ml-2">{item.title}</span>
                                                                </div>
                                                                <div className="col-span-3">
                                                                    <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Training Time:</span>
                                                                    <span className="text-gray-400 italic">Bulk Credits</span>
                                                                </div>
                                                                <div className="col-span-4">
                                                                    <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Booked on:</span>
                                                                    <span className="font-bold text-gray-700">{item.bookingDate || item.date}</span> <span className="text-gray-400 text-[10px]">@{item.bookingTime || item.time}</span>
                                                                </div>
                                                                <div className="col-span-2 text-left sm:text-right">
                                                                    <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Payment:</span>
                                                                    <span className="font-black text-purple-700">₹{item.priceAtBooking}</span> <span className="text-[9px] text-gray-400 block sm:inline">({item.paymentMode.toUpperCase()})</span>
                                                                    {item.paymentStatus === 'pending' && <span className="text-[8px] font-black text-yellow-600 block uppercase tracking-widest mt-1">Verify Pending</span>}
                                                                </div>
                                                            </div>
                                                        );
                                                    }

                                                    const parts = item.key.split('-');
                                                    const trainingDate = parts.slice(0, 3).join('-');
                                                    const netNo = parts[3] || item.net || 'Lane';
                                                    const slotTime = parts.slice(4).join('-') || item.slot || '';
                                                    const bookedDate = item.bookingDate || 'N/A';
                                                    const bookedTime = item.bookingTime || 'N/A';

                                                    return (
                                                        <div key={idx} className="p-4 border border-gray-100 bg-white rounded-2xl sm:rounded-none sm:border-0 sm:border-b sm:bg-transparent sm:p-3 sm:px-1 grid grid-cols-1 sm:grid-cols-12 gap-2 items-center text-xs">
                                                            <div className="col-span-3">
                                                                <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Activity:</span>
                                                                <span className="px-2 py-0.5 bg-green-100 text-green-700 text-[9px] font-black uppercase rounded tracking-wider">Slot</span>
                                                                <span className="font-bold text-gray-900 ml-2">{netNo}</span>
                                                            </div>
                                                            <div className="col-span-3">
                                                                <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Training Time:</span>
                                                                <span className="font-black text-slate-800">{trainingDate}</span> <span className="text-gray-400 text-[10px]">({slotTime.split(' ')[0]} {slotTime.includes('AM') ? 'AM' : 'PM'})</span>
                                                            </div>
                                                            <div className="col-span-4">
                                                                <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Booked on:</span>
                                                                <span className="font-bold text-gray-700">{bookedDate}</span> <span className="text-gray-400 text-[10px]">@{bookedTime}</span>
                                                            </div>
                                                            <div className="col-span-2 text-left sm:text-right">
                                                                <span className="inline-block sm:hidden text-[9px] font-black text-gray-400 uppercase tracking-wider mr-2">Payment:</span>
                                                                <span className="font-black text-slate-900">{item.priceAtBooking > 0 ? `₹${item.priceAtBooking}` : 'Free (Credit)'}</span> <span className="text-[9px] text-gray-400 block sm:inline">({item.paymentMode.toUpperCase()})</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Final PDF Ready Success Ticket Modal */}
                    {isSuccess && ticketData && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md overflow-y-auto no-scrollbar">
                            <div id="ticket-card" className="bg-white rounded-3xl w-full max-w-md overflow-hidden animate-up my-auto border shadow-2xl flex flex-col text-left">
                                <div className="bg-gray-900 text-white p-8 text-center relative border-b-[6px] border-dashed border-gray-200">
                                    <h3 className="text-2xl font-black uppercase tracking-widest leading-none mb-3 text-green-500">ENTRY TICKET</h3>
                                    <p className="text-[11px] font-black uppercase tracking-[0.2em] text-white">SQUARE DRIVE CRICKET ACADEMY</p>
                                </div>
                                <div className="p-8 space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <p className="text-[9px] font-black text-gray-400 uppercase mb-1">Booked By</p>
                                            <p className="text-sm font-black text-gray-900 uppercase leading-none">{ticketData.bookedBy}</p>
                                            <p className="text-[9px] font-bold text-gray-500 uppercase mt-1.5">Role: {ticketData.role}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[9px] font-black text-gray-400 uppercase mb-1">Date of Booking</p>
                                            <p className="text-xs font-black text-gray-900 uppercase leading-none">{ticketData.dateOfBooking}</p>
                                            <p className="text-[9px] font-black text-green-600 uppercase mt-1.5">ID: {ticketData.ticketNo}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-gray-50 p-5 rounded-2xl border">
                                        <p className="text-[10px] font-black text-gray-400 uppercase mb-3 border-b pb-2">Booking Details</p>
                                        <div className="space-y-3">
                                            {ticketData.details && ticketData.details.length > 0 ? ticketData.details.map((slot, i) => (
                                                <div key={i} className="flex flex-col bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm gap-2">
                                                    <div className="flex justify-between items-center border-b border-gray-50 pb-2">
                                                        <span className="text-[9px] font-black text-gray-400 uppercase tracking-widest">Net No:</span>
                                                        <span className="text-sm font-black text-gray-900">{slot.net}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[9px] font-black text-gray-400 uppercase tracking-widest">Playing Hours:</span>
                                                        <span className="text-[10px] font-bold text-gray-700 uppercase">{new Date(ticketData.trainingDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} • {slot.slot}</span>
                                                    </div>
                                                </div>
                                            )) : (
                                                <div className="text-center py-3 text-xs font-bold text-gray-500 uppercase tracking-widest">Membership Package (No Specific Lanes)</div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center bg-green-50 p-5 rounded-2xl border border-green-100">
                                        <div>
                                            <p className="text-[9px] font-black text-green-800 uppercase mb-1 tracking-widest">Payment Status</p>
                                            <p className="text-[10px] font-black text-green-600 uppercase leading-tight max-w-[120px]">{ticketData.paymentStatus}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[9px] font-black text-green-800 uppercase mb-1 tracking-widest">Amount Paid</p>
                                            <p className="text-2xl font-black text-green-700 text-right leading-none">₹{ticketData.amount}</p>
                                        </div>
                                    </div>

                                    {ticketData.verificationImage && (
                                        <div className="space-y-2 text-center pt-2">
                                            <p className="text-[9px] font-black text-gray-400 uppercase text-left tracking-widest">Payment Verification Image</p>
                                            <div className="w-full h-48 rounded-2xl overflow-hidden border border-gray-200 bg-gray-50 flex items-center justify-center p-2 shadow-inner">
                                                <img src={ticketData.verificationImage} className="w-full h-full object-contain rounded-xl" alt="Payment Proof" />
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="p-6 bg-gray-50 border-t space-y-3 no-print">
                                    <button onClick={() => window.print()} className="w-full py-4 bg-gray-900 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest flex items-center justify-center gap-3 hover:bg-green-600 transition-colors shadow-lg"><Icon name="printer" className="w-4 h-4"/> Print / Save PDF</button>
                                    <button onClick={() => { setIsSuccess(false); setTicketData(null); }} className="w-full py-4 bg-white text-gray-500 border border-gray-200 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-gray-100 transition-colors hover:text-gray-900">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
